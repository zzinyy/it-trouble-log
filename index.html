<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Trouble Log</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><p class="eyebrow">IT PRACTICE TROUBLESHOOTING LOG</p><h1>실습 장애를 기록하고<br>해결 경험을 자산으로.</h1><p class="lead">서버·네트워크·보안 실습에서 발생한 문제와 해결 과정을 한곳에 기록하세요.</p></div><div class="stats"><div><b id="total">0</b><span>전체 장애</span></div><div><b id="solved">0</b><span>해결 완료</span></div><div><b id="open">0</b><span>해결 중</span></div></div></header>
<main><section class="toolbar"><div><h2>장애 기록</h2><p>문제를 남기고, 원인과 해결 과정을 축적합니다.</p></div><button id="addBtn">+ 새 장애 기록</button></section>
<section class="filters"><input id="search" placeholder="장애명, 증상, 원인, 해결 방법 검색"><select id="category"><option value="all">전체 분야</option><option>Network</option><option>Linux</option><option>Virtualization</option><option>Security</option><option>Database</option><option>Other</option></select><select id="status"><option value="all">전체 상태</option><option value="해결 완료">해결 완료</option><option value="해결 중">해결 중</option></select><select id="priority"><option value="all">전체 중요도</option><option>긴급</option><option>높음</option><option>보통</option><option>낮음</option></select></section>
<section id="cards" class="cards"></section><div id="empty" class="empty" hidden>조건에 맞는 장애 기록이 없습니다.</div></main>
<dialog id="modal"><form id="form"><div class="modal-head"><div><p class="eyebrow">NEW TROUBLE</p><h2 id="modalTitle">새 장애 기록</h2></div><button type="button" class="close" id="closeBtn">×</button></div><input type="hidden" id="editId"><label>장애 제목<input id="title" required placeholder="예: VM에서 외부 네트워크 Ping 실패"></label><div class="grid"><label>분야<select id="formCategory"><option>Network</option><option>Linux</option><option>Virtualization</option><option>Security</option><option>Database</option><option>Other</option></select></label><label>상태<select id="formStatus"><option>해결 중</option><option>해결 완료</option></select></label></div><label>중요도<select id="formPriority"><option>보통</option><option>낮음</option><option>높음</option><option>긴급</option></select></label><label>증상<textarea id="symptom" required placeholder="어떤 문제가 발생했나요?"></textarea></label><label>원인<textarea id="cause" placeholder="확인한 원인을 적어 주세요."></textarea></label><label>해결 방법<textarea id="solution" placeholder="어떻게 해결했나요?"></textarea></label><fieldset class="check-field"><legend>재발 방지 체크리스트</legend><label class="check"><input type="checkbox" id="checkRetest"> 동일 환경에서 재테스트</label><label class="check"><input type="checkbox" id="checkDocument"> 설정 변경 내용 문서화</label><label class="check"><input type="checkbox" id="checkBackup"> 설정 또는 구성 백업</label></fieldset><div class="actions"><button type="button" class="secondary" id="cancelBtn">취소</button><button type="submit">기록 저장</button></div></form></dialog>
<footer>IT Trouble Log · 실습에서 만난 문제를 다음 해결의 단서로</footer><script src="app.js"></script></body></html>
